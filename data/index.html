<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Saved Timers</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body onload="getTimes()">
    <div class="card">
        <h2>ESP32 LED Timer Control</h2>
        <p>LED තත්වය: <span id="status" class="off">OFF</span></p>
        
        <div class="timer-box">
            <label for="onTime">LED ON කාලය (තත්පර):</label>
            <input type="number" id="onTime" value="1" min="1" max="60">
        </div>

        <div class="timer-box">
            <label for="offTime">LED OFF කාලය (තත්පර):</label>
            <input type="number" id="offTime" value="1" min="1" max="60">
        </div>

        <button id="saveBtn" onclick="saveTimer()">කාලයන් Save කර ක්‍රියාත්මක කරන්න</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
